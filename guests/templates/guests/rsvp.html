{% extends 'base.html' %}
{% load static %}
{% block page_head %}
    <link href="{% static 'bigday/css/invitation.css' %}" rel="stylesheet" xmlns="http://www.w3.org/1999/html">
{% endblock %}
{% block page_content %}
<div class="container" id="invitation-body">
    
    <section class="text-center col-12">
        <div id="invitation-details">
        <h2>London and Gavin Wedding</h2>
        <p class="lead">
            July 26, 2026<br>
            Salt Lake City, UT, United States
        </p>
        </div>
    </section>

    <section class="col-12">
        <form data-toggle="validator" id="invitation-details" class="form-horizontal" method="post"> <!--TODO change functionality of form/button-->
            <h2 id="rsvp-header" class="text-center">RSVP</h2>
            <h3 id="rsvp-header" class="text-center">Search for your party:</h3>
            <div class="clearfix"></div>
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="guest_name" class="form-control guest-input" placeholder="Enter your full name" >
            </div>
            {% if error %} <div class="form-group">{{error}}</div> {% endif %}
            <div class="form-group">
                <div class="text-center">
                    <input type="submit" class="btn btn-primary" value="Search" /> 
                </div>
            </div>
        </form>
    </section>
</div>

{% endblock %}
